[project]
name = "shamela-salaf-research"
version = "0.1.0"
description = "Corpus scanner for early Sunni statements on fawqiyya, baynuna, space, place and distance in Shamela 4"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.34.0",
  "polars>=1.30.0",
  "rich>=13.9.0",
]

[project.scripts]
shamela-research = "shamela_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shamela_research"]

[tool.hatch.build]
include = [
  "src/shamela_research/**/*.py",
  "src/shamela_research/presets/*.json",
]
